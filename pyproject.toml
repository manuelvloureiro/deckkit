[project]
name = "dpdeck"
version = "0.1.0"
description = "A 20-minute slide deck on differential privacy and privacy accounting, generated from code as PowerPoint or HTML"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10",
    "python-pptx>=1.0",
]

[project.scripts]
dpdeck = "dpdeck.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.380",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dpdeck"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
reportMissingTypeStubs = false

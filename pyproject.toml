[project]
name = "deckkit"
version = "0.1.0"
description = "Slide decks and their plots written in Python, rendered as PowerPoint or HTML"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10",
    "python-pptx>=1.0",
]

[project.scripts]
deckkit = "deckkit.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.380",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deckkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["decks"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "decks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "decks", "tests"]
extraPaths = ["decks"]
typeCheckingMode = "standard"
reportMissingTypeStubs = false
